name: CI

on:
  push:
    branches: [main, main-*]
  pull_request:
    branches: [main, main-*]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all .mjs files
        run: find src -name '*.mjs' -exec node --check {} +

      - name: Syntax check frontend
        run: node --check static/app.mjs

      - name: Import resolution check
        run: node -e "import('./src/agent/registry.mjs').catch(e => { console.error(e); process.exit(1) })"

      - name: Run tests
        run: npm test
