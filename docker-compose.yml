services:
  made:
    build: .
    ports:
      - "3100:3100"
    volumes:
      - made-data:/app/.made-data
      - ./projects:/projects
    environment:
      - MADE_HOST=0.0.0.0
      - MADE_PORT=3100
      # - MADE_TOKEN=your-secret-token  # uncomment to enable auth
    restart: unless-stopped

volumes:
  made-data:
